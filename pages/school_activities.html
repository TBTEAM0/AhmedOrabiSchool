 <script>

    document.addEventListener("DOMContentLoaded", () => {

        const btn = document.getElementById("activityBtn");
        const menu = document.getElementById("activityMenu");
        const title = document.getElementById("Activitytitle");
        const gallery = document.getElementById("galleryContainer");

        function getLang() {
            return document.documentElement.getAttribute("lang") === "ar" ? "ar" : "en";
        }

        btn.onclick = () => {
            menu.classList.toggle("show");
            btn.classList.toggle("active");
        };

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".activity-dropdown")) {
                menu.classList.remove("show");
                btn.classList.remove("active");
            }
        });

        /* ======================
           ضع الصور هنا
        ======================= */

        const galleries = {

            Ramadan: [
                {
                    type: "video",
    src: "../AolsActivies/rk.mp4",
    description: {
        en: "Ramadan Kareem Using AI By Ahmed Ramdan",
        ar: "رمضان كريم باستخدام الذكاء الإصطناعي - أحمد رمضان"
    }
                }
            ],

            em: [
                {
                    type: "video",
                    src: "../AolsActivies/Em.mp4",
                    title: "A tour of The Grand Egyptian Museum",
                    description: {
                        en: "A tour of The Grand Egyptian Museum",
                        ar: "جولة نعريفية في المتحف المصري الكبير"
                    }
                }
            ],

            nd: [
                {
                    type: "video",
                    src: "../AolsActivies/sm.mp4",
                    title: "New Decor Using AI By Saba Mostafa",
                    description: {
                        en: "New Decor using AI By Saba Mostafa",
                        ar: "ديكورد جديد باستخدام الذكاء الاصطناعي - صبي رمضان ",
                    }
                }
            ],

            alr: [
                { img: "../AolsActivies/alr.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } },
                { img: "../AolsActivies/alr2.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } },
                { img: "../AolsActivies/alr3.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } },
                { img: "../AolsActivies/alr4.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } },
                { img: "../AolsActivies/alr5.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } },
                { img: "../AolsActivies/alr6.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } },
                { img: "../AolsActivies/alr7.png", description: { en: "Administration-Level Ranking", ar: "تنصيب على مستوى الإدارة" } }
            ],

            quran: [
                { img: "../AolsActivies/quran2.jpeg", description: { en: "Quran", ar: "القرآن الكريم" } },
                { img: "../AolsActivies/quran4.jpeg", description: { en: "Quran", ar: "القرآن الكريم" } },
                { img: "../AolsActivies/quran5.jpeg", description: { en: "Quran", ar: "القرآن الكريم" } },
                { img: "../AolsActivies/quran6.jpeg", description: { en: "Quran", ar: "القرآن الكريم" } },
                { img: "../images/quran2.jpg", description: { en: "Quran", ar: "القرآن الكريم" } },
                { img: "../images/quran1.jpg", description: { en: "Quran", ar: "القرآن الكريم" } },
                { img: "../AolsActivies/quran8.jpeg", description: { en: "Quran", ar: "القرآن الكريم" } }
            ],

            sfl: [
                { img: "../AolsActivies/sfl.jpeg", description: { en: "School Football League", ar: "الدوري المدرسي لكرة القدم" } },
                { img: "../AolsActivies/sfl2.jpeg", description: { en: "School Football League", ar: "الدوري المدرسي لكرة القدم" } },
                { img: "../AolsActivies/sfl3.jpeg", description: { en: "School Football League", ar: "الدوري المدرسي لكرة القدم" } },
                { img: "../AolsActivies/sfl4.jpeg", description: { en: "School Football League", ar: "الدوري المدرسي لكرة القدم" } }
            ]

            // كمل باقي الجاليريز بنفس الشكل لو رجعتهم تاني

        };

        let currentGalleryName = null;
        let currentOpenIndex = null;

        function loadGallery(name) {

            currentGalleryName = name;
            gallery.innerHTML = "";

            if (!galleries[name]) return;

            const lang = getLang();
            const cardLabel = (typeof translations !== "undefined" && translations[lang] && translations[lang]["click-view"]) || "Click To View";

            galleries[name].forEach((item, index) => {

                const path = item.img || item.src;
                const isVideo = item.type === "video";

                gallery.innerHTML += `

            <div class="championship-card">

                ${isVideo
                        ?
                        `<video
                        src="${path}"
                        controls>
                    </video>`
                        :
                        `<img
                        src="${path}"
                        alt="${cardLabel}"
                        data-index="${index}">`
                    }

                <h3>
    ${
        isVideo
            ? (item.description?.[lang] || "")
            : cardLabel
    }
</h3>

            </div>

            `;

            });

        }

        document.querySelectorAll("#activityMenu button").forEach(button => {

            button.onclick = () => {

                title.innerHTML =
                    `<i class="fa-solid fa-images"></i> ${button.textContent}`;

                loadGallery(button.dataset.gallery);

                menu.classList.remove("show");
                btn.classList.remove("active");

            };

        });

        const modal = document.getElementById("imageModal");
        const popupImage = document.getElementById("popupImage");
        const popupVideo = document.getElementById("popupVideo");
        const popupText = document.getElementById("popupText");

        function getDescriptionByIndex(index) {
            const item = galleries[currentGalleryName] && galleries[currentGalleryName][index];
            if (!item || !item.description) return "";
            const lang = getLang();
            return item.description[lang] || item.description.en || "";
        }

        gallery.addEventListener("click", (e) => {

            const img = e.target.closest(".championship-card img");
            const video = e.target.closest(".championship-card video");

            if (img) {

                const index = Number(img.dataset.index);
                currentOpenIndex = index;

                popupVideo.pause();
                popupVideo.style.display = "none";
                popupVideo.src = "";

                popupImage.style.display = "block";
                popupImage.src = img.src;

                popupText.textContent = getDescriptionByIndex(index);

                modal.classList.add("show");

            }

            if (video) {
                // خلي الفيديو يشتغل في الكارد فقط
                return;
            }

        });

        document.querySelector(".close").onclick = () => {

            modal.classList.remove("show");

            popupVideo.pause();
            popupVideo.currentTime = 0;

            document.querySelectorAll(".championship-card video").forEach(v => {
                v.pause();
            });

            currentOpenIndex = null;

        };

        modal.onclick = (e) => {

            if (e.target === modal) {
                modal.classList.remove("show");
                popupVideo.pause();
                popupVideo.currentTime = 0;
                currentOpenIndex = null;
            }

        };

        document.addEventListener("keydown", (e) => {

            if (e.key === "Escape") {
                modal.classList.remove("show");
                popupVideo.pause();
                popupVideo.currentTime = 0;
                currentOpenIndex = null;
            }

        });

        const langSwitchBtn = document.getElementById("langSwitch");
        langSwitchBtn?.addEventListener("click", () => {
            setTimeout(() => {
                if (currentGalleryName) loadGallery(currentGalleryName);
                if (modal.classList.contains("show") && currentOpenIndex !== null) {
                    popupText.textContent = getDescriptionByIndex(currentOpenIndex);
                }
            }, 0);
        });

    });
</script>
