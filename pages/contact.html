<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | A.O.L.S</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="contact.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="icon" type="image/png" href="../images/Orabi.png">

</head>


<body>


    <header>

        <a href="/index.html" class="logo">A.O.L.S</a>


        <nav id="navbar">

            <ul>

                <li>
                    <a href="../index.html" data-i18n="nav-home">HOME</a>
                </li>

                <li>
                    <a href="../index.html#members" data-i18n="nav-principals">PRINCIPALS</a>
                </li>

                <li>
                    <a href="../index.html#stage" data-i18n="nav-class">CLASS</a>
                </li>

                <li>
                    <a href="about.html" data-i18n="nav-about">ABOUT</a>
                </li>

                <li>
                    <a href="contact.html" class="active" data-i18n="nav-contact">CONTACT</a>
                </li>



            </ul>

        </nav>

        <div class="header-right">

            <button class="lang-switch" id="langSwitch" type="button"><span class="ls-en">EN</span><span
                    class="ls-ar">AR</span></button>

            <div class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>


    </header>




    <section class="contact-page">

        <div class="contact-page__field" aria-hidden="true"></div>
        <div class="contact-page__orb contact-page__orb--a" aria-hidden="true"></div>
        <div class="contact-page__orb contact-page__orb--b" aria-hidden="true"></div>


        <div class="contact-box">


            <div class="contact-hero" data-reveal>

                <span class="eyebrow" data-i18n="contact-eyebrow">Get In Touch</span>

                <h1 data-i18n="contact-title">
                    Contact Us
                </h1>


                <p data-i18n="contact-desc">
                    Have any questions? Feel free to contact AOLS School.
                </p>

                <button class="contact-hero__scroll" type="button" data-scroll-target="#contact-info">
                    <span data-i18n="contact-scroll">View Details</span>
                    <span class="contact-hero__scroll-track" aria-hidden="true"></span>
                </button>

            </div>


            <span class="contact-divider" aria-hidden="true"></span>


            <div class="contact-container" id="contact-info" data-reveal>



                <div class="contact-info">


                    <div class="contact-card">

                        <span class="contact-card__icon"><i class="fa-solid fa-location-dot"></i></span>

                        <h3 data-i18n="contact-address-title">
                            Address
                        </h3>

                        <p>
                            <a href="https://maps.app.goo.gl/dweQeHVVFaGJ8LwGA" target="_blank"
                                data-i18n="contact-address-text">
                                School Location Here
                            </a>
                        </p>

                    </div>



                    <div class="contact-card">

                        <span class="contact-card__icon"><i class="fa-solid fa-phone"></i></span>

                        <h3 data-i18n="contact-phone-title">
                            School ID
                        </h3>

                        <p>
                            2129440
                        </p>

                    </div>



                    <div class="contact-card">

                        <span class="contact-card__icon"><i class="fa-solid fa-envelope"></i></span>

                        <h3 data-i18n="contact-email-title">
                            Email
                        </h3>

                        <p>
                            orabischools@gmail.com
                        </p>

                    </div>



                </div>











            </div>



        </div>


    </section>




    <script src="../script.js"></script>
    <script src="contact.js"></script>


</body>

</html>
