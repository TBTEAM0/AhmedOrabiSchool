<script>

    document.addEventListener("DOMContentLoaded", () => {

        const btn = document.getElementById("achievementBtn");
        const menu = document.getElementById("achievementMenu");
        const title = document.getElementById("achievementTitle");
        const gallery = document.getElementById("galleryContainer");

        // يقرأ اللغة الحالية من نفس النظام اللي بيستخدمه زرار الترجمة
        function getLang() {
            return document.documentElement.getAttribute("lang") === "ar" ? "ar" : "en";
        }

        btn.onclick = () => {
            menu.classList.toggle("show");
            btn.classList.toggle("active");
        };

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".achievement-dropdown")) {
                menu.classList.remove("show");
                btn.classList.remove("active");
            }
        });

        /* ======================
           ضع الصور هنا
           (كل description بقت en / ar)
        ======================= */

        const galleries = {

            chess: [
                { img: "../MrsEmanAchive/chess.jpg", description: { en: "Chess Championship", ar: "بطولة الشطرنج" } },
                { img: "../MrsEmanAchive/chess2.jpg", description: { en: "Chess Championship", ar: "بطولة الشطرنج" } },
                { img: "../MrsEmanAchive/chess3.jpg", description: { en: "Chess Championship", ar: "بطولة الشطرنج" } },
                { img: "../MrsEmanAchive/chess4.png", description: { en: "Chess Championship", ar: "بطولة الشطرنج" } }
            ],

            abakera: [
                {
                    img: "../MrsEmanAchive/team2.jpeg",
                    description: {
                        en: "Team A.o.l.s Season 2\n\nThe Players Are:\n1. Bassant Atef\n2. Ziad Ahmed\n3. Nada Abdallah\n4. Yaseen Ahmed\n5. Rouqia Khaled\n6. Abdallah Ahmed",
                        ar: "فريق A.o.l.s الموسم الثاني\n\nاللاعبون هم:\n1. بسنت عاطف\n2. زياد أحمد\n3. ندى عبدالله\n4. ياسين أحمد\n5. رقية خالد\n6. عبدالله أحمد"
                    }
                },
                { img: "../MrsEmanAchive/abdallah.jpeg", description: { en: "Abdallah Ahmed", ar: "عبدالله أحمد" } },
                { img: "../MrsEmanAchive/basant.jpeg", description: { en: "Bassant Atef", ar: "بسنت عاطف" } },
                { img: "../MrsEmanAchive/rahmamo7sen.jpeg", description: { en: "Yaseen Ahmed", ar: "ياسين أحمد" } },
                { img: "../MrsEmanAchive/rouqia.jpeg", description: { en: "Rouqia Khaled", ar: "رقية خالد" } },
                { img: "../MrsEmanAchive/zeyad.jpeg", description: { en: "Ziad Ahmed", ar: "زياد أحمد" } },
                { img: "../MrsEmanAchive/nada.jpeg", description: { en: "Nada Abdallah", ar: "ندى عبدالله" } }
            ],

            windows: [
                { img: "../MrsEmanAchive/windows.jpeg", description: { en: "Buy new windows", ar: "شراء نوافذ جديدة" } },
                { img: "../MrsEmanAchive/windows.jpeg", description: { en: "Buy new windows", ar: "شراء نوافذ جديدة" } }
            ],

            quran: [
                { img: "../MrsEmanAchive/quran.jpeg", description: { en: "Quran Championship", ar: "بطولة القرآن الكريم" } },
                { img: "../MrsEmanAchive/quran3.jpeg", description: { en: "Quran Championship", ar: "بطولة القرآن الكريم" } },
                { img: "../MrsEmanAchive/quran7.jpeg", description: { en: "Quran Championship", ar: "بطولة القرآن الكريم" } }
            ],

            ml: [
                { img: "../MrsEmanAchive/ml.jpeg", description: { en: "Renovation of the school courtyard", ar: "تجديد فناء المدرسة" } },
                { img: "../MrsEmanAchive/ml2.jpeg", description: { en: "Renovation of the school courtyard", ar: "تجديد فناء المدرسة" } },
                { img: "../MrsEmanAchive/ml3.jpeg", description: { en: "Renovation of the school courtyard", ar: "تجديد فناء المدرسة" } },
                { img: "../MrsEmanAchive/ml4.jpeg", description: { en: "Renovation of the school courtyard", ar: "تجديد فناء المدرسة" } },
                { img: "../MrsEmanAchive/ml5.jpeg", description: { en: "Renovation of the school courtyard", ar: "تجديد فناء المدرسة" } },
                { img: "../MrsEmanAchive/ml6.jpeg", description: { en: "Renovation of the school courtyard", ar: "تجديد فناء المدرسة" } }
            ]

         

        };

        let currentGalleryName = null;
        let currentOpenIndex = null;

        function loadGallery(name) {

            currentGalleryName = name;
            gallery.innerHTML = "";

            if (!galleries[name]) return;

            const lang = getLang();
            const cardLabel = (typeof translations !== "undefined" && translations[lang] && translations[lang]["click-view"]) || "Click To View";

            galleries[name].forEach((item, index) => {

                gallery.innerHTML += `

            <div class="championship-card">

                <img
                    src="${item.img}"
                    alt="${cardLabel}"
                    data-index="${index}">

                <h3>${cardLabel}</h3>

            </div>

            `;

            });

        }

        document.querySelectorAll("#achievementMenu button").forEach(button => {

            button.onclick = () => {

                title.innerHTML =
                    `<i class="fa-solid fa-images"></i> ${button.textContent}`;

                loadGallery(button.dataset.gallery);

                menu.classList.remove("show");
                btn.classList.remove("active");

            };

        });

        const modal = document.getElementById("imageModal");
        const popupImage = document.getElementById("popupImage");
        const popupText = document.getElementById("popupText");

        function getDescriptionByIndex(index) {
            const item = galleries[currentGalleryName] && galleries[currentGalleryName][index];
            if (!item || !item.description) return "";
            const lang = getLang();
            return item.description[lang] || item.description.en || "";
        }

        gallery.addEventListener("click", (e) => {

            const img = e.target.closest(".championship-card img");
            if (!img) return;

            const index = Number(img.dataset.index);
            currentOpenIndex = index;

            popupImage.src = img.src;
            popupImage.alt = img.alt;

            popupText.textContent = getDescriptionByIndex(index);

            modal.classList.add("show");

        });

        document.querySelector(".close").onclick = () => {
            modal.classList.remove("show");
            currentOpenIndex = null;
        };

        modal.onclick = (e) => {
            if (e.target === modal) {
                modal.classList.remove("show");
                currentOpenIndex = null;
            }
        };

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                modal.classList.remove("show");
                currentOpenIndex = null;
            }
        });

        const langSwitchBtn = document.getElementById("langSwitch");
        langSwitchBtn?.addEventListener("click", () => {
            setTimeout(() => {
                if (currentGalleryName) loadGallery(currentGalleryName);
                if (modal.classList.contains("show") && currentOpenIndex !== null) {
                    popupText.textContent = getDescriptionByIndex(currentOpenIndex);
                }
            }, 0);
        });

    });

</script>
